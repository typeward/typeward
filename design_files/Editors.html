<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Typeward · Editor variants</title>
<meta name="viewport" content="width=1440, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body, #root { background:#1a1814; margin:0; height:100%; font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body { font-feature-settings:'cv02','cv03','cv04','ss01'; letter-spacing:-0.005em; }
  @keyframes evblink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="editors/design-canvas.jsx"></script>
<script type="text/babel" src="editors/tweaks-panel.jsx"></script>
<script type="text/babel" src="editors/editor-variants.jsx"></script>
<script type="text/babel" data-presets="react">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showMarkdown": true,
  "showTypst": true,
  "showRmd": true,
  "showQuarto": true,
  "showJupyter": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const W = 880, H = 580;

  const variants = [
    { id:'md',      label:'Markdown',  show:t.showMarkdown, sub:'Plain markdown · live HTML preview · pandoc backend',           el:<MdEditor /> },
    { id:'typst',   label:'Typst',     show:t.showTypst,    sub:'Modern markup · 180 ms live recompile · 2-page paper preview',  el:<TypstEditor /> },
    { id:'rmd',     label:'R Markdown',show:t.showRmd,      sub:'RStudio-flavored chunks · console + plot pane · knitr',         el:<RmdEditor /> },
    { id:'quarto',  label:'Quarto',    show:t.showQuarto,   sub:'.qmd · python/julia/r cells · multi-format render',             el:<QuartoEditor /> },
    { id:'jupyter', label:'Jupyter',   show:t.showJupyter,  sub:'.ipynb · stacked cell-by-cell layout · inline outputs',         el:<JupyterEditor /> },
  ].filter(v => v.show);

  return (
    <>
      <DesignCanvas>
        <DCSection id="editors" title="Format-specific editors" subtitle="The same Typeward chrome, adapted to each authoring format. Each pane keeps the editor on the left and a format-appropriate preview on the right.">
          {variants.map(v=>(
            <DCArtboard key={v.id} id={`ed-${v.id}`} label={`${v.label} · ${v.sub}`} width={W} height={H}>
              {v.el}
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Variants shown" />
        <TweakToggle label="Markdown"   value={t.showMarkdown} onChange={v=>setTweak('showMarkdown', v)} />
        <TweakToggle label="Typst"      value={t.showTypst}    onChange={v=>setTweak('showTypst', v)} />
        <TweakToggle label="R Markdown" value={t.showRmd}      onChange={v=>setTweak('showRmd', v)} />
        <TweakToggle label="Quarto"     value={t.showQuarto}   onChange={v=>setTweak('showQuarto', v)} />
        <TweakToggle label="Jupyter"    value={t.showJupyter}  onChange={v=>setTweak('showJupyter', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
