[package]
name = "typeward"
version = "0.0.1"
description = "Typeward — multiplatform editor for LaTeX and Typst"
authors = ["Typeward"]
edition = "2021"

# crate-type required for both desktop static linking and future mobile (cdylib)
[lib]
name = "typeward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# Auto-updater. Dormant until an updater keypair exists: the pubkey in
# tauri.conf.json is a "" placeholder and `bundle.createUpdaterArtifacts`
# stays false in the checked-in config, so a keyless `tauri build` never signs
# anything and the runtime check is a no-op (see src/lib/updater.ts). The
# plugin only reads/parses the pubkey at check time, not at init, so an empty
# pubkey doesn't break app startup or a local build. tauri-plugin-process backs
# the post-install relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
which = "7"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"

# Integrations foundation (Phase 0): outbound HTTP, OS keyring, OAuth PKCE,
# loopback redirect server. Kept behind project-scoped IPC commands so the
# capability surface stays minimal.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
base64 = "0.22"
rand = "0.9"
url = "2"
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# VCS — Phase 3. libgit2 bindings; the "https" feature uses openssl on
# Unix and the OS-native TLS stack (WinHTTP/SChannel) on Windows.
git2 = { version = "0.20", default-features = false, features = ["https"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# PDF annotation export (E7). `lopdf` edits existing PDFs (appends `/Annot`
# objects to a page's `/Annots`); `pdf-writer` is create-only and can't reopen a
# compiled PDF. Trimmed to just the parser — the date/rayon default features
# aren't used for load → append-annotation → save.
lopdf = { version = "0.43", default-features = false }

# Grammar — Phase 5 (upgraded to Harper 2.x for E6). Rust-native, runs
# in-process, zero network. `harper-tex` / `harper-typst` are Harper's
# first-party format parsers so LaTeX/Typst markup is skipped, not linted.
harper-core = "2.5"
harper-tex = "2.5"
harper-typst = "2.5"

# WebDAV cloud provider. quick-xml is non-validating (immune to XXE /
# entity-expansion by construction) so it can parse attacker-controlled
# PROPFIND multistatus bodies safely; percent-encoding builds WebDAV hrefs.
quick-xml = "0.37"
percent-encoding = "2"
sentry = { version = "0.46.2", default-features = false, features = ["reqwest", "rustls"] }
uuid = { version = "1.23.4", features = ["v4"] }
os_info = { version = "3.15.0", default-features = false }

# Desktop-only single-instance guard: a second launch focuses the running
# window rather than starting a rival process over the same project data.
# `cfg(desktop)` isn't a cargo-known cfg, so gate by the concrete mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Move-to-trash for project delete (Recycle Bin / Trash / freedesktop). Desktop
# only — mobile has no trash concept, so project.rs falls back to a hard delete.
trash = "5"

# harper-core 2.5.0 (the latest published release, and current `master`) fails
# to compile on rustc >= ~1.93: three lint rules call `then_kind_any` /
# `then_kind_any_but_not` with a bare `&[fn_a, fn_b, fn_c]` array of distinct
# fn-item types, which newer rustc no longer unifies into the generic
# `&'static [F]` parameter (E0308). Upstream already fixed the same class of
# call elsewhere (e.g. `soon_to_be.rs` casts `as fn(&TokenKind) -> bool`) but
# missed these three. We vendor a copy carrying only that fix (tests/benches
# stripped) until a fixed harper-core is published, then this block + the
# vendor/ dir can be deleted and the crates.io release used directly.
[patch.crates-io]
harper-core = { path = "vendor/harper-core" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
