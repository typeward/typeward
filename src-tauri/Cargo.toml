[package]
name = "typeward"
version = "0.0.1"
description = "Typeward — multiplatform editor for LaTeX, Typst, Markdown and more"
authors = ["Typeward"]
edition = "2021"

# crate-type required for both desktop static linking and future mobile (cdylib)
[lib]
name = "typeward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
which = "7"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
