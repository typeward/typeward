[package]
name = "typeward"
version = "0.0.1"
description = "Typeward — multiplatform editor for LaTeX and Typst"
authors = ["Typeward"]
edition = "2021"

# crate-type required for both desktop static linking and future mobile (cdylib)
[lib]
name = "typeward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
which = "7"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"

# Integrations foundation (Phase 0): outbound HTTP, OS keyring, OAuth PKCE,
# loopback redirect server. Kept behind project-scoped IPC commands so the
# capability surface stays minimal.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
base64 = "0.22"
rand = "0.9"
url = "2"
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# VCS — Phase 3. libgit2 bindings; the "https" feature uses openssl on
# Unix and the OS-native TLS stack (WinHTTP/SChannel) on Windows.
git2 = { version = "0.20", default-features = false, features = ["https"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Grammar — Phase 5. Rust-native, runs in-process, zero network.
harper-core = "0.59"

# WebDAV cloud provider. quick-xml is non-validating (immune to XXE /
# entity-expansion by construction) so it can parse attacker-controlled
# PROPFIND multistatus bodies safely; percent-encoding builds WebDAV hrefs.
quick-xml = "0.37"
percent-encoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
