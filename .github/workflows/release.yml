# Release pipeline. Builds signed (or, until keys land, plain) installers for
# every desktop OS and publishes a DRAFT GitHub Release on the PUBLIC
# typeward/releases repo — assets on the private app repo aren't anonymously
# downloadable, which would break both the updater feed and the download page.
#
# Flow: `npm run release -- x.y.z` bumps + tags -> push the tag -> this runs ->
# a human smoke-tests one installer per OS on the draft -> Publish. Publishing
# the draft materializes the git tag on typeward/releases, so
# `releases/latest/download/...` (updater endpoint + download links) goes live
# with no site redeploy.
#
# SIGNING IS ENFORCED. A release build FAILS when a signing input its OS needs is
# absent. Shipping deliberately-unsigned builds (the beta) requires an explicit
# opt-in, so unsigned is never the accidental default:
#   - workflow_dispatch input `allow_unsigned: true`, or
#   - repository variable ALLOW_UNSIGNED_RELEASE = 'true' (covers tag pushes).
# Either one turns the hard failure into a loud ::warning and stamps the release
# notes as unsigned. Required inputs per leg:
#   - all:     TAURI_SIGNING_PRIVATE_KEY (updater signature + .sig artifacts).
#   - macOS:   APPLE_* (codesign + notarization).
#   - Windows: AZURE_* AND a `bundle.windows.signCommand` in tauri.conf.json —
#              the env passthrough alone signs nothing.
#   - Linux:   no OS signing story; integrity rides on SHA256SUMS + attestation.
# Every published artifact is hashed into SHA256SUMS and attested with build
# provenance, signed or not — that is what the download/docs pages tell users to
# verify.
#
# Still absent-by-default (not signing): no RELEASES_REPO_TOKEN -> assets upload
# as a workflow artifact + a loud ::error naming the manual step.
# See _plans/40-distribution-signing-updates.md and CLAUDE.md > Release & updates.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true
        type: string
      allow_unsigned:
        description: 'Publish an UNSIGNED build (deliberate beta escape hatch)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Set on purpose, never by default. Empty string = enforce signing.
  ALLOW_UNSIGNED: ${{ (github.event.inputs.allow_unsigned == 'true' || vars.ALLOW_UNSIGNED_RELEASE == 'true') && 'true' || '' }}

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-latest
            os: macos
            target: aarch64-apple-darwin
          - label: Windows (x64)
            runner: windows-latest
            os: windows
            target: x86_64-pc-windows-msvc
          - label: Linux (x64)
            runner: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout app (at the release tag)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.TAG }}
          path: app

      # typeward/texlive-wasm is public, so the default GITHUB_TOKEN checks it
      # out with no extra secret (same tokenless sibling layout as build.yml).
      # The sibling ref comes from package.json `config.texliveWasm` — the ONE
      # place the engine pin is recorded (_plans/41-texlive-wasm-release-ops.md
      # §2) — so rebuilding this tag always gets the same engine release
      # instead of whatever the sibling's main has moved to.
      - name: Read texlive-wasm pin
        id: texlive
        shell: bash
        working-directory: app
        run: |
          ref="$(node -p "require('./package.json').config?.texliveWasm")"
          if [ -z "$ref" ] || [ "$ref" = "undefined" ]; then
            echo "::error::package.json is missing config.texliveWasm — the texlive-wasm sibling checkout has no pinned ref."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout texlive-wasm sibling
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: typeward/texlive-wasm
          ref: ${{ steps.texlive.outputs.ref }}
          path: texlive-wasm

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Pinned to an explicit version for reproducible CI — bump deliberately.
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux system deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build texlive-wasm sibling
        working-directory: texlive-wasm
        run: |
          npm ci
          npm run build

      # Builtin-only script — no app node_modules needed yet; tauri-action runs
      # the app's `npm ci` itself before the build.
      - name: Fetch Tectonic sidecar
        shell: bash
        working-directory: app
        run: node scripts/fetch-tectonic.mjs

      - name: Symlink Tectonic for the gnu triple (Linux)
        if: matrix.os == 'linux'
        run: |
          cd app/src-tauri/binaries
          ln -sf tectonic-x86_64-unknown-linux-musl tectonic-x86_64-unknown-linux-gnu

      # Signing gate. Collect every signing input this leg needs; a missing one
      # FAILS the release unless the unsigned escape hatch was set on purpose.
      # Secrets can't be read in `if:` so route them through env here and expose
      # plain outputs.
      - name: Signing gate
        id: sign
        shell: bash
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          # No `set -u`: the macOS runner's bash 3.2 errors on an empty array
          # expansion under it.
          set -eo pipefail
          missing=()

          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            missing+=("TAURI_SIGNING_PRIVATE_KEY (updater signature; no key -> no .sig, no latest.json, updater stays dormant — _plans/40)")
            echo "updater=false" >> "$GITHUB_OUTPUT"
          else
            echo "updater=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ matrix.os }}" = "macos" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            missing+=("APPLE_* (macOS codesign + notarization; Gatekeeper will refuse/warn)")
          fi

          if [ "${{ matrix.os }}" = "windows" ]; then
            # The AZURE_* passthrough signs nothing on its own: Tauri only signs
            # when tauri.conf.json declares bundle.windows.signCommand.
            has_sign_command="$(node -p "Boolean(require('./src-tauri/tauri.conf.json').bundle?.windows?.signCommand)")"
            if [ -z "$AZURE_CLIENT_ID" ] || [ "$has_sign_command" != "true" ]; then
              missing+=("Windows Authenticode (needs AZURE_* secrets AND bundle.windows.signCommand in tauri.conf.json; SmartScreen will warn)")
            fi
          fi

          if [ ${#missing[@]} -eq 0 ]; then
            echo "All signing inputs present for ${{ matrix.os }}."
            exit 0
          fi

          printf 'Missing signing inputs for %s:\n' "${{ matrix.os }}"
          printf '  - %s\n' "${missing[@]}"
          if [ -n "${ALLOW_UNSIGNED:-}" ]; then
            echo "::warning::UNSIGNED RELEASE (${{ matrix.os }}) — allowed only because the unsigned escape hatch is set. Users get no OS-level authenticity guarantee; SHA256SUMS + build provenance are the only integrity checks."
            exit 0
          fi
          echo "::error::Refusing to build an unsigned release (${{ matrix.os }}). Add the missing signing inputs above, or set the escape hatch on purpose: re-run with the workflow_dispatch input allow_unsigned=true, or set the repository variable ALLOW_UNSIGNED_RELEASE=true."
          exit 1

      # Overlay JSON deep-merged over tauri.conf via `--config`, flipping ONLY
      # createUpdaterArtifacts on — the checked-in config stays dormant so a
      # keyless local `npm run tauri build` never touches the signing path.
      - name: Write updater overlay (signed builds only)
        if: steps.sign.outputs.updater == 'true'
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":true}}' > "${{ runner.temp }}/updater.overlay.json"

      - name: Build the app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Source-map upload is opt-in (vite.config.ts) so ordinary builds stay
          # hermetic; the release build is the one place that opts in. No token
          # -> no maps, no upload, just a warning.
          SENTRY_UPLOAD: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Frontend secrets (empty is fine — the app degrades to free tier).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MENDELEY_CLIENT_ID: ${{ secrets.VITE_MENDELEY_CLIENT_ID }}
          VITE_DROPBOX_CLIENT_ID: ${{ secrets.VITE_DROPBOX_CLIENT_ID }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          # Updater signing (absent -> no updater artifacts, no key needed).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization (all absent -> unsigned).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (future — signCommand not wired yet; passed through
          # so it activates the moment tauri.conf gains a signCommand).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          # No tagName: tauri-action only BUILDS. Cross-repo publishing to
          # typeward/releases happens in the publish job via action-gh-release.
          projectPath: app
          args: ${{ steps.sign.outputs.updater == 'true' && format('--config {0}/updater.overlay.json', runner.temp) || '' }}

      # Installers + updater bundles + their .sig signatures. Per-OS globs that
      # don't match (a leg only builds its own OS's targets) are ignored. The
      # raw .app directory is intentionally excluded — only the .app.tar.gz
      # updater bundle is needed.
      - name: Collect artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/macos/*.sig
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/appimage/*.sig
            app/src-tauri/target/release/bundle/rpm/*.rpm

  publish:
    name: Assemble + draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Build provenance attestations for the published artifacts.
      id-token: write
      attestations: write
    steps:
      - name: Checkout (full history for the changelog)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-bundle-*
          path: collected

      - name: Changelog (git-cliff)
        id: cliff
        continue-on-error: true
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Flatten assets + stable-named copies
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          mkdir -p dist
          # Flatten the per-OS artifact trees into one dir.
          for f in collected/**/*; do
            [ -f "$f" ] && cp -f "$f" dist/
          done
          cd dist
          # Stable filenames for the download page (doc 30); versioned
          # originals are kept alongside so the updater URLs still resolve.
          copy_one() { # <glob> <stable-name>
            local matches=( $1 )
            if [ ${#matches[@]} -gt 0 ]; then
              cp -f "${matches[0]}" "$2"
              echo "  ${matches[0]} -> $2"
            fi
          }
          copy_one 'Typeward_*_x64-setup.exe' 'Typeward-windows-x64-setup.exe'
          copy_one 'Typeward_*_aarch64.dmg'   'Typeward-macos-aarch64.dmg'
          copy_one 'Typeward_*_amd64.AppImage' 'Typeward-linux-x86_64.AppImage'
          copy_one 'Typeward_*_amd64.deb'      'Typeward-linux-amd64.deb'
          echo "Assets:"; ls -1

      - name: Assemble latest.json (only when signed artifacts exist)
        shell: bash
        run: |
          node scripts/build-latest-json.mjs \
            --dir dist \
            --version "${{ steps.ver.outputs.version }}" \
            --base-url "https://github.com/typeward/releases/releases/download/${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --out dist/latest.json

      # Every asset gets a checksum line. The download page and docs tell users
      # to verify against this file, so it must exist for EVERY release, signed
      # or not — it is the only integrity check an unsigned build has.
      - name: SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( * )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release assets were produced — nothing to checksum."
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Cryptographic provenance for each asset (which workflow, which commit,
      # which runner built it) — verifiable with `gh attestation verify`.
      # Independent of code signing; it is what an unsigned beta can still offer.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'

      - name: Append verification + signing status to the notes
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          touch RELEASE_NOTES.md
          # Same inputs the per-OS signing gate checks; if any is absent this
          # release only got through because the unsigned escape hatch was set,
          # and the notes must say so rather than let users assume otherwise.
          has_sign_command="$(node -p "Boolean(require('./src-tauri/tauri.conf.json').bundle?.windows?.signCommand)")"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$APPLE_CERTIFICATE" ] \
            || [ -z "$AZURE_CLIENT_ID" ] || [ "$has_sign_command" != "true" ]; then
            {
              echo
              echo "### Unsigned build"
              echo
              echo "These installers are **not fully code-signed** and may carry no updater"
              echo "signature. Windows SmartScreen and macOS Gatekeeper will warn. Verify the"
              echo "download against \`SHA256SUMS\` below before running it."
            } >> RELEASE_NOTES.md
          fi
          {
            echo
            echo "### Verify your download"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "Build provenance: \`gh attestation verify <file> --repo ${{ github.repository }}\`"
          } >> RELEASE_NOTES.md

      - name: Detect cross-repo release token
        id: token
        shell: bash
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if [ -n "$RELEASES_REPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish draft on typeward/releases
        if: steps.token.outputs.has_token == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          repository: typeward/releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: Typeward ${{ env.TAG }}
          draft: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: dist/*

      # No token: don't fail — hand the assets back as an artifact and shout the
      # exact manual step so the release can be finished by hand.
      - name: Fallback — upload assets as a workflow artifact
        if: steps.token.outputs.has_token != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typeward-release-${{ env.TAG }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

      - name: Fallback — announce the manual step
        if: steps.token.outputs.has_token != 'true'
        shell: bash
        run: |
          echo "::error::RELEASES_REPO_TOKEN is missing, so nothing was published. Manual step: (1) create the PUBLIC typeward/releases repo if it doesn't exist; (2) add a RELEASES_REPO_TOKEN secret here — a PAT with write access to typeward/releases; (3) download the 'typeward-release-${TAG}' workflow artifact from this run and attach its files to a new DRAFT release tagged ${TAG} on typeward/releases. See CLAUDE.md > Release & updates."
