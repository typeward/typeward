# Frontend + Rust test suite. Runs on every push/PR to main so regressions
# surface before a manual build is ever dispatched.
#
# Same sibling-checkout layout as build.yml: package.json depends on
# `texlive-wasm: file:../texlive-wasm`, so the app checks out into `app/`
# and the sibling into `texlive-wasm/` (built before `npm ci`).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck + Vitest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout texlive-wasm sibling
        uses: actions/checkout@v4
        with:
          repository: typeward/texlive-wasm
          path: texlive-wasm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Build texlive-wasm sibling
        working-directory: texlive-wasm
        run: |
          npm ci
          npm run build

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Vitest
        working-directory: app
        run: npm test

      # Guards the load-bearing editor code-split (vite.config.ts advancedChunks):
      # a bundler bump that breaks the runtime-helpers group id match would fold
      # the helpers into a vendor chunk and drag pdfjs/codemirror/markdown into the
      # boot path silently. check:bundle inspects dist/index.html and fails if that
      # regresses. Runs after a real production build.
      - name: Build frontend bundle
        working-directory: app
        run: npm run build

      - name: Check bundle shape
        working-directory: app
        run: npm run check:bundle

  rust-audit:
    name: RustSec advisories
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # The two ignored quick-xml advisories (fixed >=0.41) still match a residual
      # quick-xml 0.39.4 pinned by wayland-scanner (Linux-only build-time proc-macro
      # via tauri-plugin-clipboard-manager -> arboard -> wl-clipboard-rs); it parses
      # trusted protocol XML bundled inside the wayland crates, never runtime input.
      # Our direct quick-xml (the WebDAV PROPFIND security boundary) is on 0.41+.
      # Drop the ignores once wayland-scanner moves off ^0.39.
      - name: Cargo audit
        working-directory: app/src-tauri
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  rust:
    name: Cargo tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # The Tauri build script validates `bundle.externalBin` resource paths,
      # so even `cargo test` needs the (gitignored) Tectonic sidecar present —
      # same fetch + Linux gnu-triple symlink as build.yml.
      - name: Set up Node (for the Tectonic fetch script)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Tectonic sidecar
        shell: bash
        working-directory: app
        run: npm run fetch:tectonic

      - name: Symlink Tectonic for the gnu triple
        run: |
          cd app/src-tauri/binaries
          ln -sf tectonic-x86_64-unknown-linux-musl tectonic-x86_64-unknown-linux-gnu

      - name: Cargo test
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
