# Supabase CLI project config.
#
# Linked to the typeward-staging project (ref: aepfxzsnhjonzevwglgr).
# Anyone working against this folder should `supabase link --project-ref
# aepfxzsnhjonzevwglgr` after installing the CLI so `db push` /
# `gen types` know which project to talk to.

project_id = "typeward-staging"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local-only auth config; remote project's settings (email templates,
# providers, redirect URLs) are managed in the dashboard.
site_url = "http://127.0.0.1:1420"
additional_redirect_urls = ["http://127.0.0.1:0/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[edge_runtime]
enabled = true
inspector_port = 8083
