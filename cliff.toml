# git-cliff configuration — changelog from conventional commits.
# Conventional commits are already the house style, so this needs no runtime
# deps and just groups the log for a release body. No emojis by decision.
# Used by .github/workflows/release.yml (git-cliff-action) to fill the release
# notes; also runnable locally: `git cliff --latest`.

[changelog]
header = ""
# tera template. One section per release, commits grouped and sorted.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}{% if timestamp %} ({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Map commit types to changelog sections. Ordering here drives display order.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^ci", group = "CI" },
  # Drop release-bump chores from the notes; keep other chores.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Chores" },
  # Everything else (build, test, style, deps bumps) is noise in release notes.
  { message = ".*", skip = true },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
